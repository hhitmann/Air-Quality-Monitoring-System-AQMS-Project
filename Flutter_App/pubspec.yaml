name: aqms
description: "Karachi Air Quality Monitoring System - Flutter Application"
publish_to: 'none' # Prevent accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0  # Minimum Dart SDK version (Flutter 3.24+)

dependencies:
  flutter:
    sdk: flutter

  # ---------- AQMS Specific Packages ----------
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  overlay_support: ^2.1.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  csv: ^6.0.0
  fl_chart: ^0.69.2
  syncfusion_flutter_gauges: ^27.1.57

  # ---------- Firebase ----------
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3

  # ---------- Connectivity & Notifications ----------
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  flutter_background_service: ^5.0.10

  # ---------- Standard Flutter Packages ----------
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true